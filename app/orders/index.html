<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng | ShopAdmin</title>
    <link rel="stylesheet" href="../static/css/orders.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container">
    <aside class="sidebar" id="sidebar">
    </aside>

    <main class="main-content">
        <header>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Tìm mã đơn, tên khách hàng...">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-export" id="btnAddOrder" style="background: var(--success);"><i
                        class="fas fa-plus"></i> Thêm đơn hàng
                </button>
                <button class="btn-export"><i class="fas fa-download"></i> Xuất Excel</button>
            </div>
        </header>

        <section class="stats" id="order-stats">
        </section>

        <section class="table-container">
            <div class="order-controls">
                <div class="tabs">
                    <button class="tab active">Tất cả</button>
                    <button class="tab">Chờ xử lý</button>
                    <button class="tab">Đang giao</button>
                    <button class="tab">Đã xong</button>
                    <button class="tab">Đã hủy</button>
                </div>
                <div class="date-filter">
                    <label>
                        <input type="date" style="padding: 5px; border: 1px solid #ddd; border-radius: 5px;">
                    </label>
                </div>
            </div>

            <table id="orderTable">
                <thead>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>
    </main>
</div>

<div id="orderModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3 id="modalTitle">Thêm Đơn Hàng Mới</h3>
        <form id="orderForm">
            <input type="hidden" id="orderId">
            <div class="form-group">
                <label>Khách hàng</label>
                <select id="customerId" required></select>
            </div>

            <div class="form-group">
                <label>Sản phẩm</label>
                <select id="productId" required></select>
            </div>

            <div class="form-group">
                <label>Số lượng (Amount)</label>
                <input type="number" id="orderAmount" required min="1" value="1">
            </div>

            <div class="form-group">
                <label>Trạng thái</label>
                <select id="orderStatus" required>
                    <option value="pending">Chờ xử lý</option>
                    <option value="delivering">Đang giao</option>
                    <option value="done">Hoàn thành</option>
                    <option value="cancel">Đã hủy</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button type="button" class="btn-cancel" onclick="closeModal()">Hủy</button>
                <button type="submit" class="btn-save">Lưu Đơn Hàng</button>
            </div>
        </form>
    </div>
</div>

<div id="orderDetailModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3 style="margin-bottom: 15px;">Chi tiết Đơn Hàng <span id="detailOrderId"
                                                                 style="color: var(--primary-color);"></span></h3>
        <div class="detail-grid">
            <p><strong>Ngày tạo:</strong> <span id="detailDate"></span></p>
            <p><strong>Trạng thái:</strong> <span id="detailStatus" class="badge"></span></p>
            <hr>
            <h4>Thông tin Khách hàng</h4>
            <p><strong>Tên:</strong> <span id="detailCustomerName"></span></p>
            <p><strong>Số điện thoại:</strong> <span id="detailCustomerPhone"></span></p>
            <p><strong>Địa chỉ:</strong> <span id="detailCustomerAddress"></span></p>
            <hr>
            <h4>Thông tin Sản phẩm</h4>
            <p><strong>Tên:</strong> <span id="detailProductName"></span></p>
            <p><strong>Đơn giá:</strong> <span id="detailProductPrice"></span></p>
            <p><strong>Số lượng:</strong> <span id="detailAmount"></span></p>
            <hr>
            <h3 style="text-align: right;"><strong>Tổng tiền: <span id="detailTotal"
                                                                    style="color: var(--danger);"></span></strong></h3>
        </div>
        <div class="modal-buttons">
            <button type="button" class="btn-cancel" onclick="closeDetailModal()">Đóng</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script type="module" src="../static/js/orders.js"></script>
</body>
</html>
