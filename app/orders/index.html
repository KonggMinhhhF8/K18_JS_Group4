<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng | ShopAdmin</title>
    <link rel="stylesheet" href="../static/css/orders.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container">
  <aside class="sidebar">
    <h2>ShopAdmin</h2>
    <ul>
      <li><i class="fas fa-home"></i><a href="../index.html">Tổng quan</a></li>
      <li><i class="fas fa-box"></i><a href="../products/index.html">Sản phẩm</a></li>
      <li class="active"><i class="fas fa-shopping-cart"></i><a href="#">Đơn hàng</a> </li>
      <li><i class="fas fa-users"></i><a href="../customers/index.html">Khách hàng</a> </li>
      <li><i class="fas fa-chart-line"></i><a href="../reports/index.html">Báo cáo</a> </li>
    </ul>
  </aside>

  <main class="main-content">
    <header>
      <div class="search-bar">
          <label>
              <input type="text" placeholder="Tìm mã đơn, tên khách hàng...">
          </label>
      </div>
      <button class="btn-export"><i class="fas fa-download"></i> Xuất Excel</button>
    </header>

    <section class="stats" id="order-stats">
    </section>

    <section class="table-container">
      <div class="order-controls">
        <div class="tabs">
          <button class="tab active">Tất cả</button>
          <button class="tab">Chờ xử lý</button>
          <button class="tab">Đang giao</button>
          <button class="tab">Đã xong</button>
        </div>
        <div class="date-filter">
            <label>
                <input type="date" style="padding: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </label>
        </div>
      </div>

      <table id="orderTable">
        <thead>
        </thead>
        <tbody>
        </tbody>
      </table>
    </section>
  </main>
</div>
<script type="module" src="../static/js/orders.js"></script>
</body>
</html>
