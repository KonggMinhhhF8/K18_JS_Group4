<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Doanh Thu | ShopAdmin</title>
    <link rel="stylesheet" href="../static/css/reports.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
  <aside class="sidebar">
    <h2>ShopAdmin</h2>
    <ul>
      <li><i class="fas fa-home"></i><a href="../index.html">Tổng quan</a></li>
      <li class="active"><i class="fas fa-box"></i><a href="../products/index.html">Sản phẩm</a></li>
      <li><i class="fas fa-shopping-cart"></i><a href="../orders/index.html">Đơn hàng</a></li>
      <li><i class="fas fa-users"></i><a href="../customers/index.html">Khách hàng</a> </li>
      <li><i class="fas fa-chart-line"></i><a href="#">Báo cáo</a> </li>
    </ul>
  </aside>

  <main class="main-content">
    <header>
      <h2>Báo cáo kinh doanh</h2>
      <div class="filter-group">
        <input type="date" value="2026-01-01">
        <input type="date" value="2026-01-24">
        <button style="padding: 8px 15px; background: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer;">Lọc</button>
      </div>
    </header>

    <div class="stats-grid" id="reports-grid">
    </div>

    <div class="charts-container">
      <div class="chart-box">
        <h3>Biểu đồ doanh thu 7 ngày gần nhất</h3>
        <canvas id="revenueChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>Cơ cấu sản phẩm</h3>
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <div class="top-products">
      <h3>Sản phẩm bán chạy nhất</h3>
      <table id="topProductsTable">
          <thead>
          </thead>
          <tbody>
          </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  // Biểu đồ đường (Revenue Chart)
  const ctxRevenue = document.getElementById('revenueChart').getContext('2d');
  new Chart(ctxRevenue, {
    type: 'line',
    data: {
      labels: ['18/01', '19/01', '20/01', '21/01', '22/01', '23/01', '24/01'],
      datasets: [{
        label: 'Doanh thu (VNĐ)',
        data: [12000000, 19000000, 15000000, 25000000, 22000000, 30000000, 28000000],
        borderColor: '#3498db',
        backgroundColor: 'rgba(52, 152, 219, 0.1)',
        fill: true,
        tension: 0.4
      }]
    }
  });

  // Biểu đồ tròn (Category Chart)
  const ctxCategory = document.getElementById('categoryChart').getContext('2d');
  new Chart(ctxCategory, {
    type: 'doughnut',
    data: {
      labels: ['Điện thoại', 'Phụ kiện', 'Máy tính bảng'],
      datasets: [{
        data: [60, 25, 15],
        backgroundColor: ['#3498db', '#2ecc71', '#f1c40f']
      }]
    }
  });
</script>
<script type="module" src="../static/js/reports.js"></script>
</body>
</html>
