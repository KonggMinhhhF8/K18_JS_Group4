<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Doanh Thu | ShopAdmin</title>
    <link rel="stylesheet" href="../static/css/reports.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <aside class="sidebar" id="sidebar">
    </aside>

    <main class="main-content">
        <header>
            <h2>Báo cáo kinh doanh</h2>
            <div class="filter-group">
                <input type="date" id="startDate">
                <input type="date" id="endDate">
                <button id="btnFilter"
                        style="padding: 8px 15px; background: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer;">
                    Lọc
                </button>
            </div>
        </header>

        <div class="stats-grid" id="reports-grid">
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <h3>Biểu đồ doanh thu</h3>
                <canvas id="revenueChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>Cơ cấu sản phẩm</h3>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <div class="top-products">
            <h3>Sản phẩm bán chạy nhất</h3>
            <table id="topProductsTable">
                <thead>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script type="module" src="../static/js/reports.js"></script>
</body>
</html>
